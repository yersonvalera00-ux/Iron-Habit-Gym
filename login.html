<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Iron Habit Gym</title>

  <link rel="icon" type="image/png" href="logo-icon-favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body id="app-body">

  <div id="layout-login" class="page-layout active-layout">
    <main class="login-section">
      <div class="login-card">
        
        <!-- Identidad de Marca -->
        <div class="login-logo">
          <img src="logo-icon.png" alt="Logo de Iron Habit Gym" class="login-logo-img">
          <span class="login-logo-text">Iron Habit Gym</span>
        </div>

        <!-- Encabezado de Sección -->
        <header class="login-header">
          <h1>Iniciar Sesión</h1>
          <p>Introduce las credenciales de administración del gimnasio</p>
        </header>

        <!-- Formulario de Inicio de Sesión -->
        <form id="form-login-principal" novalidate aria-label="Formulario de inicio de sesión">
          
          <div class="login-group">
            <label for="login-email">Usuario o correo</label>
            <div class="input-with-icon">
              <i class="ti ti-mail" aria-hidden="true"></i>
              <input 
                type="text" 
                id="login-email" 
                name="login-email" 
                placeholder="correo@ejemplo.com" 
                required 
                autocomplete="username"
                aria-describedby="err-login-email"
                spellcheck="false">
            </div>
            <small class="field-error-msg" id="err-login-email" role="alert"></small>
          </div>

          <div class="login-group" style="margin-bottom: 1.25rem;">
            <label for="login-password">Contraseña</label>
            <div class="input-with-icon">
              <i class="ti ti-lock" aria-hidden="true"></i>
              <input 
                type="password" 
                id="login-password" 
                name="login-password" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
                aria-describedby="err-login-password">
              <button 
                type="button" 
                class="eye-toggle-btn" 
                id="toggle-pwd-btn" 
                aria-label="Mostrar contraseña" 
                aria-pressed="false"
                data-target="login-password">
                <i class="ti ti-eye" aria-hidden="true"></i>
              </button>
            </div>
            <small class="field-error-msg" id="err-login-password" role="alert"></small>
          </div>

          <button type="submit" class="btn-login-submit" id="btn-login-submit">
            Ingresar al Sistema
          </button>

          <!-- Enlaces de Navegación -->
          <nav class="login-extra-links" aria-label="Enlaces de recuperación y registro">
            <a href="index.php" class="login-link-secondary">Volver a la pagina principal</a>
            <p class="login-forgot-text">
              ¿Olvidaste tu contraseña? <a href="recuperar.html" class="login-link-primary">Recupérala aquí</a>
            </p>
            <a href="registro.html" class="login-link-primary login-create-account">Crear cuenta</a>
          </nav>

        </form>

      </div>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
